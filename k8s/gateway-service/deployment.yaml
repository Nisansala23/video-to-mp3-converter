apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway-service
        image: 887401460535.dkr.ecr.us-east-1.amazonaws.com/video-audio-app/gateway-service:latest
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: gateway-service-secret
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
