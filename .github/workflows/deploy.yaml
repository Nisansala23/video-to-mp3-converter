name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, gateway-service, converter-service, notification-service]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push ${{ matrix.service }}
      run: |
        docker build -t $ECR_REGISTRY/video-audio-app/${{ matrix.service }}:${{ github.sha }} \
          ./${{ matrix.service }}
        docker push $ECR_REGISTRY/video-audio-app/${{ matrix.service }}:${{ github.sha }}

    - name: Update image tag in config repo
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"
        git clone https://Nisansala23:${{ secrets.CONFIG_REPO_TOKEN }}@github.com/Nisansala23/video-to-mp3-config.git
        cd video-to-mp3-config
        sed -i "s|tag: .*|tag: ${{ github.sha }}|g" helm/${{ matrix.service }}/values.yaml
        git add .
        git commit -m "update ${{ matrix.service }} image tag to ${{ github.sha }}"
        git push
